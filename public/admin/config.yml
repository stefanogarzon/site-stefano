  - name: pages
    label: Páginas fixas
    files:
      - name: home_pt
        label: Início (PT)
        file: src/content/pages/home/pt.md
        fields:
          - name: title
            label: Título
            widget: string
          - name: description
            label: Frase de apresentação
            widget: text
          - name: body
            label: Texto
            widget: markdown
            required: true
      - name: home_en
