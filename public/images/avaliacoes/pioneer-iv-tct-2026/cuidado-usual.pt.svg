<rect class="bg" x="0.5" y="0.5" width="679" height="129" rx="10"/>
<text class="m" x="24" y="34" font-size="13">Pacientes do braço cuidado usual</text>
<text class="t" x="24" y="76" font-size="13">Cuidado usual</text>
<rect class="b" x="150.0" y="61" width="203.7" height="22" rx="3"/>
<text class="ia" x="251.8" y="76.5" font-size="12.5" font-weight="600" text-anchor="middle">45,7%</text>
<rect class="n" x="355.6" y="61" width="242.3" height="22" rx="3"/>
<text class="in" x="476.8" y="76.5" font-size="12.5" font-weight="600" text-anchor="middle">54,3%</text>
<rect class="b" x="150" y="100" width="12" height="12" rx="2"/>
<text class="m" x="168" y="110.5" font-size="12.5">com avaliação fisiológica</text>
<rect class="n" x="355" y="100" width="12" height="12" rx="2"/>
<text class="m" x="373" y="110.5" font-size="12.5">só angiografia</text>

</svg>
