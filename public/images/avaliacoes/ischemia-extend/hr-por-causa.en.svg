.ia{fill:#1d1a16}.in{fill:#efe8dc}
.grid{stroke:#3a342c}.ax{stroke:#a89f92}.ink{stroke:#efe8dc}.inkf{fill:#efe8dc}
.ref{stroke:#e0896a}.reft{fill:#e0896a}
}</style>
<rect class="bg" x="0.5" y="0.5" width="679" height="271" rx="10"/>
<text class="m" x="24" y="34" font-size="13">Invasive vs conservative, HR and 95% CI, log scale</text>
