<text class="t" x="24" y="72" font-size="13">All-cause death</text>
<text class="m" x="24" y="87" font-size="11.5">adjusted HR</text>
<line class="ink" x1="317.5" x2="395.3" y1="74" y2="74" stroke-width="2"/>
<circle class="inkf" cx="357.0" cy="74" r="5"/>
