<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" width="680" height="272" role="img" aria-label="HR invasive vs conservative: all-cause death 0.97 (0.86 to 1.09); cardiovascular 0.88 (0.75 to 1.02); noncardiovascular 1.18 (0.96 to 1.45); noncardiovascular after reclassification 1.10 (0.92 to 1.33).">
<title>HR invasive vs conservative: all-cause death 0.97 (0.86 to 1.09); cardiovascular 0.88 (0.75 to 1.02); noncardiovascular 1.18 (0.96 to 1.45); noncardiovascular after reclassification 1.10 (0.92 to 1.33).</title>
<style>
.bg{fill:#faf6ee;stroke:#e2d9c8}
.t{fill:#211c16}.m{fill:#6b6257}
.a{fill:#c4643f}.b{fill:#3f6ea8}.n{fill:#b3a898}
.ia{fill:#fff}.in{fill:#211c16}
.grid{stroke:#e2d9c8}.ax{stroke:#6b6257}.ink{stroke:#211c16}.inkf{fill:#211c16}
.ref{stroke:#c4643f}.reft{fill:#c4643f}
text{font-family:'Inter Variable', Inter, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif}
.v{font-family:'Source Serif 4 Variable', 'Source Serif 4', Georgia, serif;font-size:18px}
