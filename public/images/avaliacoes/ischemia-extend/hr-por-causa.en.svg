<line class="ax" x1="293.8" x2="293.8" y1="218" y2="223"/>
<text class="m" x="293.8" y="237" font-size="12" text-anchor="middle">0.8</text>
<line class="ax" x1="332.4" x2="332.4" y1="218" y2="223"/>
<text class="m" x="332.4" y="237" font-size="12" text-anchor="middle">0.9</text>
<line class="ax" x1="367.0" x2="367.0" y1="218" y2="223"/>
<text class="m" x="367.0" y="237" font-size="12" text-anchor="middle">1.0</text>
<line class="ax" x1="426.8" x2="426.8" y1="218" y2="223"/>
