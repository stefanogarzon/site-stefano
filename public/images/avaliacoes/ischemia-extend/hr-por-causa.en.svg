<text class="m" x="24" y="207" font-size="11.5">98 deaths of unknown cause</text>
<line class="ink" x1="339.6" x2="460.5" y1="194" y2="194" stroke-width="2"/>
<circle class="inkf" cx="398.3" cy="194" r="5"/>
